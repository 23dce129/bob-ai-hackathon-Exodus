submission:
  title: "PharmaGuard AI"              # REQUIRED — Project display name

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Pharmacovigilance teams manually sift through thousands of FDA FAERS reports
    to detect adverse drug reaction signals — a process that is slow, error-prone,
    and requires deep specialist expertise. Drug safety scientists and regulatory
    affairs professionals lack an integrated tool that combines statistical signal
    detection, dossier completeness checking, and CTD section traceability in a
    single workflow.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    PharmaGuard AI is a full-stack pharmacovigilance platform that automatically
    detects adverse drug reaction safety signals from FDA FAERS data using
    Proportional Reporting Ratio (PRR) analysis, scores and ranks signals by
    clinical priority, checks ICH M4 CTD dossier completeness, and traces each
    signal to the required regulatory submission sections — all through a React
    dashboard and an IBM Bob-integrated MCP server.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "PRR-based ADR signal detection with 95% CI, chi-squared/Fisher test, and configurable thresholds"
    - "Multi-dimensional priority scoring combining PRR strength, report volume, trend direction, serious outcome rate, and cluster context"
    - "ICH M4 CTD dossier readiness checker with weighted per-module (M1–M5) completeness scoring"
    - "Signal-to-CTD section traceability engine linking each flagged ADR to the regulatory sections that must document it"
    - "IBM Bob MCP server integration exposing the full pharmacovigilance pipeline as Bob-callable AI tools"

  tech_stack:
    languages: ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React", "Vite", "Tailwind CSS", "Pydantic"]
    ibm_technologies: ["IBM watsonx.ai", "IBM Bob", "IBM Bob MCP Server"]
    databases: ["DuckDB"]
    other: ["Uvicorn", "pytest", "pandas", "scikit-learn", "scipy", "Recharts", "react-router-dom"]

  what_we_are_most_proud_of: >         # Optional but recommended
    The end-to-end signal traceability engine that links a detected statistical
    ADR signal directly to the specific ICH M4 CTD regulatory sections that must
    document it, and the IBM Bob MCP integration that makes every pipeline
    capability available as a conversational tool directly inside Bob.

  known_limitations: >                 # Optional but recommended
    Uses a bundled synthetic FAERS sample dataset (~500 rows), not a live FDA
    FAERS database connection. The watsonx.ai narrative generation is optional —
    all endpoints work deterministically without credentials. No user
    authentication is implemented. The frontend is a hackathon prototype and is
    not production-hardened.

